<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> <!-- ut8설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 반응형 설정 -->
  <title>test7.html(CSS연습)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
  <style>
  .black-han-sans-regular {
    font-family: "Black Han Sans", sans-serif;
    font-weight: 400;
    font-style: normal;
  }

  </style>
</head>
<body>
  <h2>CSS연습(구글폰트 사용하기)</h2>
  <p>1.안녕하세요</p>
  <p style="font-size: 60px;">2.안녕하세요</p>
  <p >3.안녕하세요</p>
  <div class="black-han-sans-regular">
    <p>4.안녕하세요</p>
    <p>5.안녕하세요</p>
    <p>6.안녕하세요</p>
  </div>
  <p>7.안녕하세요</p>
  <p>8.안녕하세요</p>
  <p>9.안녕하세요</p>
  <div>10.안녕하세요</div>
  <p>11.<span>안녕</span>하세요</p>
  <p>12.안녕하세요</p>
  <p>13.안녕하세요</p>
  <div>
    <div>14-1.안녕하세요</div>
    <div>14-2.안녕하세요</div>
    <div>14-3.안녕하세요</div>
    <div>14-4.안녕하세요</div>
  </div>
  <div>15.안녕하세요</div>
  <div>16.안녕하세요</div>
</body>
