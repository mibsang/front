<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test12.html</title>
  <style>
    .aa1, .aa2, .aa3 {
      background-color: aqua;
      display: inline;
    }
    .aa4 {
      background-color: beige;
      /* display: none; */
      visibility: hidden;
    }
    .aa5, .aa6, .aa7 {
      background-color: orange;
      border: 1px solid gray;
      width: 400px;
    }
    .bb1:hover {
      background-color: yellow;
    }
    .bb2 {
      border: 1px solid red;
      width: 100px;
      padding: 10px;
      display: inline-block;
    }
    .bb2:hover {
      background-color: yellow;
    }
    .bb3{
      display: block;
      border: 1px solid red;
    }
    .bb3:hover {
      background-color: yellow;
    }
  </style>
</head>
<body>
  <h2>Display 속성</h2>
  <p>
    속성 : visibility(기본값 : 보이기) / hidden(감추기) / inherit(부모요소의 값을 상속)
  </p>
  <p>
    <b>Display 속성</b>
    none : 화면에서 완전히 사라지게 한다.
  </p>
  <h3>사용예제</h3>
  <div class="aa1">1. 안녕</div>
  <div class="aa2">2. 안녕</div>
  <div class="aa3">3. 안녕</div>
  <div class="aa4">4. 안녕</div>
  <hr/>
  <h2>InLine / InLine-Block / Block</h2>
  <div class="aa5">
    5.<font color="red" class="bb1">안녕(InLine)</font>하세요
  </div>
  <div class="aa6">
    6.<span class="bb2"><font color="green">안녕(InLine-Block)</font>하세요</span>
  </div>
  <div class="aa7">
    7.<span class="bb3"><font color="blue">안녕(Block)</font>하세요</span>
  </div>
</body>
</html>
