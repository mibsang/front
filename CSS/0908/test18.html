<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test18.html</title>
  <style>
    body {
      margin: 0px;
      padding: 0px;
    }
    .container {
      width: 1000px;
      margin: 0px auto;
      font-size: 25px;
    }
    div {
      background-color: #eee;
      border: 1px solid gray;
      font-size: 20px;
    }
    div#area {
      width: 960px;
      margin: 0 auto;
      height: 300px;
      background-color: blueviolet;
    } 
    #tbl{
      width: 960px;
      margin: 0 auto;
      height: 400px;
      background-color: brown;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #bbb;
      text-align: center;
      color: #fff;
    }
    div#img {
      text-align: center;
      padding: 15px 0px;
    }
    /* 미디어 쿼리 */
    /* screen width >= 1024 (max-width < 1024px == max-width 1024px)*/
    @media screen and (max-width: 1024px){
      .container {
      width: 700px;
      margin: 0px auto;
      font-size: 15px;
      }
      div {
        background-color: #444;
        border: 1px solid #000;
        font-size: 20px;
      }
      div#area {
        width: 680px;
        margin: 0 auto;
        height: 200px;
        background-color: chocolate;
      } 
      #tbl{
        width: 680px;
        margin: 0 auto;
        height: 250px;
        background-color: darkturquoise;
        border-collapse: collapse;
      }
      th, td {
        border: 1px solid #000;
        text-align: center;
        color: #fff;
      }
      div#img img{
        width: 680PX;
        text-align: center;
      }
    }
    @media screen and (max-width: 768px){
      .container {
      width: 460px;
      margin: 0px auto;
      font-size: 15px;
      }
      div {
        background-color: #EEE;
        border: 1px solid gray;
        font-size: 14px;
      }
      div#area {
        width: 440px;
        margin: 0 auto;
        height: 100px;
        background-color: orange;
      } 
      #tbl{
        width: 440px;
        margin: 0 auto;
        height: 200px;
        background-color: crimson;
        border-collapse: collapse;
      }
      div#img img {
        width: 440px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="text-align: center;">미디어 쿼리 연습</h2>
    <p style="text-align: right;">(반응형 웹사이트 : Responsive Web Deign)</p>
    <hr />
    <ul>
      <li>데스크탑 : 1024px 이상</li>
      <li>태블릿 : 769px ~ 1023px</li>
      <li>모바일 : 481PX ~ 768px 이하</li>
      <li>모바일 : 480px 이하</li>
    </ul>
    <hr />
    <div>이곳은 반응형 웹 사이트를 위한 화면입니다.</div>
    <hr />
    <div id="area"></div>
    <hr />
    <table id="tbl">
      <tr>
        <th>주제</th>
        <th>강사</th>
        <th>장소</th>
      </tr>
      <tr>
        <td>웹표준에 대하여</td>
        <td>홍길동</td>
        <td>그린아카데미</td>
      </tr>
      <tr>
        <td>java에 대하여</td>
        <td>김말숙</td>
        <td>그린아카데미 402호</td>
      </tr>
      <tr>
        <td>Front와 Backend에 대하여</td>
        <td>이기자</td>
        <td>청주 가로수길</td>
      </tr>
    </table>
    <hr />
    <div id="img">
      <img src="../../Images/11.jpg" />
    </div>
  </div>
</body>
</html>
