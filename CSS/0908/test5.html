<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test5.html</title>
  <style>
    ul li {
      list-style: none;
      background-color: beige;
      width: 300px;
      padding: 10px;
      text-align: center;
      font-weight: 500;
    }
    ul li:nth-child(2n) {
      background-color: brown;
    }
    ul li:nth-child(2n+1) {
      background-color: violet;
    }
    ul li:first-child {
      background-color: aquamarine;
    }
    ul li:last-child {
      background-color: aquamarine;
    }
    ul li:hover {
      background-color: #ddd;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>목록태그 css적용하기</h2>
    <ul>
      <li><b>제목</b></li>
      <li>가</li>
      <li>나</li>
      <li>다</li>
      <li>라</li>
      <li>마</li>
      <li>바</li>
      <li>사</li>
      <li>아</li>
      <li>자</li>
      <li>차</li>
      <li>카</li>
      <li>타</li>
      <li>파</li>
      <li>하</li>
      <li>A</li>
      <li>B</li>
      <li>C</li>
      <li>D</li>
      <li>E</li>
      <li>F</li>
    </ul>
  </div>
</body>
</html>
