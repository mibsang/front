<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test9.html</title>
  <style>
    .box {
      float: left; /* left, right */
      width: 30%;
      /* height: 300px; */
      padding: 15px;
      border: 1px solid #ddd;
      line-height: 30px;
      overflow: auto;
    }
    .box1 {background-color: aqua;}
    .box2 {background-color: bisque;}
    .box3 {background-color: blueviolet;}
    .box4 {background-color: brown;}
    .box5 {
      clear: both;
      background-color: chocolate;
    }
    .box6 {
      clear: both;
      background-color: yellowgreen;
    }
  </style>
</head>
<body>
  <div id="container">
    <h2>CSS OverFlow</h2>
    <div class="box box1"><img src="../../Images/11.jpg" width="300px" height="300px"></div>
    <div class="box box2"><img src="../../Images/12.jpg" width="300px" height="200px"></div>
    <div class="box box3"><img src="../../Images/13.png" width="300px" height="300px"></div>
    <div class="box box4"><img src="../../Images/14.png" width="300px" height="100px"></div>
    <div class="box box5"><img src="../../Images/15.png" width="300px" height="300px"></div>
    <div class="box box6"><img src="../../Images/16.png" width="300px" height="300px"></div>
  </div>
</body>
</html>
