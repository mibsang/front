<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test6.html</title>
  <style>
    div.ex1 {
      width: 500px;
      margin: auto;
      border: 2px solid gray;
    }
    div.ex2 {
      max-width: 500px;
      margin: auto;
      border: 2px solid gray;
    }

  </style>
</head>
<body>
  <h2>css의 Max-width</h2>
  <div class="ex1">이곳의 폭은 500px 입니다.(500)</div>
  <br/>
  <div class="ex2">이곳의 폭은 500px 입니다.(Max-width : 500)</div>
  <br/>
</body>
</html>
