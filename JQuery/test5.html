<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test4.html</title>
  <link rel="icon" href="data:,">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    $(() => {
      
      $("#eventCheck").click(() => {
        $(".mbc").hide();
        $("p.kbs .atom").css({
          "color" : "red",
          "backgroundColor" : "yellow"
        });
      });
      $("#eventCheck").dblclick(() => $(".mbc").show());

      $("#showCheck").dblclick(() => $(".mbc").show());
      
      $("#enterCheck").mouseenter(() => $("#enterCheck").css("backgroundColor", "pink"));
      $("#enterCheck").mouseleave(() => $("#enterCheck").css("backgroundColor", "white"));

      $("#mouseoverCheck").mouseover(() => $("#eCheck").css("backgroundColor", "gray"));
      $("#mouseoverCheck").mouseout(() => $("#eCheck").css("backgroundColor", "#fff"));

      // $("div.inner").mouseover(() => console.log("안으로 들어왔어요"));
      // $("div.inner").mouseout(() => console.log("밖으로 나왔어요"));
      $("div.inner").on({
        "mouseenter" : () => $("div.inner").css("backgroundColor", "pink"),
        "mouseleave" : () => $("div.inner").css("backgroundColor", "green"),
        "click" : () => $("div.inner").css("backgroundColor", "blue")
      });
    });
      
</script>
<style>
  .outer {
    width: 300px;
    height: 300px;
    background-color: yellow;
  }
  .inner {
    width: 200px;
    height: 200px;
    background-color: green;
  }
</style>
</head>
<body>
<p><br></p>
<div class="container">
  <input type="button" value="클릭이벤트감추기" id="eventCheck" class="btn btn-primary mr-3"/>
  <input type="button" value="클릭이벤트보이기(더블클릭)" id="showCheck" class="btn btn-info mr-3"/>
  <input type="button" value="새로고침" onclick="location.reload()" class="btn btn-danger"/>
  <hr/>
  <p>1.안녕하세요.</p>
  <p class="mbc">2.안녕하세요.</p>
  <p class="kbs">3.<span class="atom">안녕</span>하세요.</p>
  <p class="mbc">4.안녕하세요.</p>
  <div>
    <span id="enterCheck">5.안녕하세요.</span>
  </div>
  <p class="mbc">6.안녕하세요.</p>
  <p id="mouseoverCheck">7.<span id="eCheck">안녕</span>하세요.</p>
  <hr/>
  <div class="outer">
    <div class="inner"></div>
  </div>
</div>
</body>
</html>
