<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="data:,">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    
    $(() => {
      // $("img").on("click", () => {
      //   $("img").hide("show", () => $("img").show("hide"));
      // });

      $("#showBtn").on("click", () => {
        // $("img").show();
        $("img").fadeIn(1000);
        $("img").fadeOut(1000);
        $("img").fadeIn(1000);
      });

      $("#hideBtn").on("click", () => {
        // $("img").hide();
        $("img").fadeOut(1000, () => alert("작업완료"));
      });
    });
      
</script>
<style>
  div.rec {
    width: 200px;
    height: 200px;
    display: none;
  }
  div #aa{
    background-color: red;
  }
  div #bb{
    background-color: green;
  }
  div #cc{
    background-color: blue;
  }
  img {display: none;}
</style>
</head>
<body>
<p><br></p>
<div class="container">
  <h2></h2>
  <input type="button" id="showBtn" value="이미지보이기" class="btn btn-success mr-3"/>
  <input type="button" id="hideBtn" value="감추기" class="btn btn-warning mr-3"/>
  <input type="button" id="recShowBtn" value="도형보이기" class="btn btn-primary mr-3"/>
  <input type="button" id="recHideBtn" value="도형감추기" class="btn btn-warning mr-3"/>
  <input type="button" id="recToggleBtn" value="도형보이기/감추기" class="btn btn-secondary mr-3"/>
  <hr/>
  <div id="aa" class="rec"></div>
  <div id="bb" class="rec"></div>
  <div id="cc" class="rec"></div>
  <hr/>
  <img src="../images/12.jpg" width="400px" height="350px" alt="" />
</div>
</body>
</html>
