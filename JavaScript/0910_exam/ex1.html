<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ex1.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    
    function gugudan() {
      let str = "";
      let res = 0;
      let dan = prompt("출력할 구구단을 입력하세요");

      str = "*** " + dan + "단 ***<br>"
      str += "=".repeat(10)+"<br>";
      
      for(let i=1; i<=9; i++) {
        res = dan * i;
        str += dan + " * " + i + " = " + res +"<br>";
      }
      document.getElementById("demo").innerHTML = str;
    }
    
    function opinion() {
      let ans = confirm("출력창을 초기화 하시려면 확인버튼을 눌러주세요");

      if(ans) {
        location.reload();
      }
    }
    
</script>
</head>
<body>
<p><br></p>
<div class="container">
  <h2>구구단 출력 프로그램(보완)</h2>
  <p></p>
  <span><button class="btn btn-info me-2" type="button" onclick="gugudan()">연산시작</button></span>
  <span><button class="btn btn-warning" type="button" onclick="opinion()">초기화</button></span>
  <hr>
  <div id="demo">구구단은 여기에 출력됩니다.</div>
</div>
</body>
</html>
