<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ex1.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    
    let su1 = '';
    let opt = '';
    let su2 = '';

    function calc(val) {
      const disp= document.getElementById('disp');
      const res = document.getElementById('res');

      if (val === 'AC') {
        su1 = '';
        opt = '';
        su2 = '';
        disp.value = '';
        res.value = '';
        return;
      }

      if (val === '⬅') {
        if (su2 !== '') {
          su2 = su2.slice(0, -1);
        } else if (opt !== '') {
          opt = '';
        } else {
          su1 = su1.slice(0, -1);
        }
        disp.value = su1 + opt + su2;
        return;
      }

      if (val === '+' || val === '-' || val === '*' || val === '/') {
        if (opt === '') {
          opt = val;
          disp.value = su1 + opt + su2;
        }
        return;
      }

      if (val === '=') {
        if (opt === '') return;

        const s1 = Number(su1);
        const s2 = Number(su2);
        let result = 0;

        if (opt === '+') {
          result = s1 + s2;
        } else if (opt === '-') {
          result = s1 - s2;
        } else if (opt === '*') {
          result = s1 * s2;
        } else if (opt === '/') {
          result = s1 / s2;
        }

        // res에 결과값을 표시하고, disp에는 입력했던 수식을 그대로 남겨둠
        res.value = result;
        su1 = '';
        opt = '';
        su2 = '';
        return;
      }

      // 숫자, 소수점 입력 >> 연산자를 아직 입력하지 않았으면 su1에, 입력했으면 su2에 이어붙임
      if (opt === '') {
        su1 += val;
      } else {
        su2 += val;
      }
      disp.value = su1 + opt + su2;
    }
  </script>
  <style>  
  .calculator {
    display: inline-block;
  }
  .display {
    margin-bottom: 5px;
  }
  .btn-grid {
    display: grid;
    grid-template-columns: repeat(4, 80px);
    gap: 4px;
  }

  .btn-grid .btn {
    width: 100%;
    height: 100%;
    margin: 0;
  }

  /* table의 colspan="2" 대신 */
  .btn-zero {
    grid-column: span 2;
  }

  /* table의 rowspan="2" 대신 */
  .btn-equal {
    grid-row: span 2;
  }
  </style>
</head>
<body>
<p><br></p>
<div class="container">
  <h2>계산기 만들기</h2>
  <div class="calculator">
    <div class="display">
      <input type="text" name="disp" id="disp" class="form-control text-end bg-dark" style="color: #fff; border: 0px;">
      <input type="text" name="res" id="res" class="form-control text-end bg-dark" style="color: #fff; border: 0px;" readonly>
    </div>

    <div class="btn-grid">
      <button type="button" onclick="calc('AC')" class="btn btn-danger">AC</button>
      <button type="button" onclick="calc('⬅')" class="btn btn-warning">⬅</button>
      <button type="button" onclick="calc('/')" class="btn btn-secondary">/</button>
      <button type="button" onclick="calc('*')" class="btn btn-secondary">*</button>

      <button type="button" onclick="calc('7')" class="btn btn-secondary">7</button>
      <button type="button" onclick="calc('8')" class="btn btn-secondary">8</button>
      <button type="button" onclick="calc('9')" class="btn btn-secondary">9</button>
      <button type="button" onclick="calc('-')" class="btn btn-secondary">-</button>

      <button type="button" onclick="calc('4')" class="btn btn-secondary">4</button>
      <button type="button" onclick="calc('5')" class="btn btn-secondary">5</button>
      <button type="button" onclick="calc('6')" class="btn btn-secondary">6</button>
      <button type="button" onclick="calc('+')" class="btn btn-secondary">+</button>

      <button type="button" onclick="calc('1')" class="btn btn-secondary">1</button>
      <button type="button" onclick="calc('2')" class="btn btn-secondary">2</button>
      <button type="button" onclick="calc('3')" class="btn btn-secondary">3</button>
      <button type="button" onclick="calc('=')" class="btn btn-success btn-equal">=</button>

      <button type="button" onclick="calc('0')" class="btn btn-secondary btn-zero">0</button>
      <button type="button" onclick="calc('.')" class="btn btn-secondary">.</button>
    </div>
  </div>
</div>
</body>
</html>
