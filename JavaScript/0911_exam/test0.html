<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ex1.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    
    
    
</script>
<style>
  td {
    text-align: center;
    vertical-align: middle;
    padding: 0;
    margin: 0;
  }

  .btn {
    width: 80px;
  }
</style>
</head>
<body>
<p><br></p>
<div class="container">
  <h2>버튼연습</h2>
  <div class="calculator">
    <table class="table table-bordered m-0 p-0">
      <tr>
        <td>
          <input type="text" name="res" id="res" class="form-control text-end bg-dark" style="color: #fff;"><br>
          <input type="text" name="disp" id="disp" class="form-control text-end bg-dark" style="color: #fff;" readonly>
        </td>
      </tr>
    </table>
    <table class="table table-bordered m-0 p-0">
      <tr>
        <td><button type="button" onclick="calc()" class="btn btn-danger">AC</button></td>
        <td><button type="button" onclick="calc()" class="btn btn-warning">⬅</button></td>
        <td><button type="button" onclick="calc()" class="btn btn-secondary">/</button></td>
        <td><button type="button" onclick="calc()" class="btn btn-secondary">*</button></td>
      </tr>
      <tr>
        <td><button type="button" onclick="calc()" class="btn btn-secondary">7</button></td>
        <td><button type="button" onclick="calc()" class="btn btn-secondary">8</button></td>
        <td><button type="button" onclick="calc()" class="btn btn-secondary">9</button></td>
        <td><button type="button" onclick="calc()" class="btn btn-secondary">-</button></td>
      </tr>
      <tr>
        <td><button type="button" onclick="calc()" class="btn btn-secondary">4</button></td>
        <td><button type="button" onclick="calc()" class="btn btn-secondary">5</button></td>
        <td><button type="button" onclick="calc()" class="btn btn-secondary">6</button></td>
        <td><button type="button" onclick="calc()" class="btn btn-secondary">+</button></td>
      </tr>
      <tr>
        <td><button type="button" onclick="calc()" class="btn btn-secondary">1</button></td>
        <td><button type="button" onclick="calc()" class="btn btn-secondary">2</button></td>
        <td><button type="button" onclick="calc()" class="btn btn-secondary">3</button></td>
        <td rowspan="2"><button type="button" onclick="calc()" class="btn btn-secondary" style="height: 90px;">=</button></td>
      </tr>
      <tr>
        <td colspan="2"><button type="button" onclick="calc()" class="btn btn-secondary" style="width: 200px;">0</button></td>
        <td><button type="button" onclick="calc()" class="btn btn-secondary">.</button></td>
      </tr>
    </table>
  </div>
</div>
</body>
</html>
