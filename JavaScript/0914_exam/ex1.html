<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ex1.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    
    // 본문의 내용을 모두 로딩시킨 후 처리
    window.onload = function() {
      let productVar = document.getElementById("product");
      let priceVar = document.getElementById("price");
      let eaVar = document.getElementById("ea");
    
      // btnCalc.addEventListener('click',function() {
      btnCalc.addEventListener('click',() => {
        let product = productVar.value;
        let price = priceVar.value;
        let ea = eaVar.value;

        if(product.trim() == '' || price.trim() == '' || ea.trim() == '' || isNaN(price) || isNaN(ea)) {
          alert("품목, 단가, 수량을 확인해주세요");
          productVar.focus();
          return false;
        }

        let res = price * ea;

        demo.innerHTML = `상품명 : ${product}, 단가 : ${price}, 수량 : ${ea}, 가격 : ${res}`;
      });
    }
    
</script>
</head>
<body>
<p><br></p>
<div class="container">
  <h2>상품 가격 계산하기</h2>
  <form name="myform">
    <div class="input-group mb-3">
      <div class="input-group-text">상품명</div>
      <input type="text" name="product" id="product" value="에어컨" autofocus class="form-control">
    </div>
    <div class="input-group mb-3">
      <div class="input-group-text">상품가격</div>
      <input type="text" name="price" id="price" value="1500000" class="form-control">
    </div>
    <div class="input-group mb-3">
      <div class="input-group-text">구매수량</div>
      <input type="number" name="ea" id="ea" value="1" class="form-control">
    </div>
    <div>
      <input type="button" value="계산하기" id="btnCalc" class="btn btn-success">
    </div>
  </form>
  <hr>
  <div id="demo"></div>
</div>
</body>
</html>
