<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ex2.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    
    function fCheck() {
      // 지역번호, 국번호, 전화번호
      let area = document.getElementById("tel1").value;
      let mid = document.getElementById("tel2").value;
      let number = document.getElementById("tel3").value;
      
      if(area === "--" || mid === "" || number === "") {
        alert("지역번호를 선택하고 국번호와 전화번호를 모두 입력해주세요");
        return;
      }
      if(isNaN(mid) || isNaN(number)) {
        alert("국번호와 전화번호는 숫자만 입력해주세요");
        return;
      }
      document.getElementById("demo").innerText = "전화번호 : " + area + " - " + mid + " - " + number;
    }
    
    function demoClear() {
      document.getElementById("demo").innerText = "";
    }
</script>
</head>
<body>
<p><br></p>
<div class="container">
  <h2>함수연습</h2>
  <form name="myform">
    <div class="input-group">
      <div class="input-group-text">전화번호</div>
      <select name="tel" id="tel1" class="form-select me-2">
        <option value="--" selected>--</option>
        <option value="010">010</option>
        <option value="02">02</option>
        <option value="031">031</option>
        <option value="033">033</option>
        <option value="041">041</option>
        <option value="043">043</option>
      </select>-
      <input type="text" name="tel" id="tel2" class="form-control ms-2 me-2" maxlength="4" required>-
      <input type="text" name="tel" id="tel3" class="form-control ms-2 me-3" maxlength="4" required>
      <div>
        <button type="button" onclick="fCheck()" class="btn btn-success me-2">출력</button>
        <button type="reset" onclick="demoClear()" class="btn btn-warning">초기화</button>
      </div>
    </div>
  </form>
  <hr>
  <div id="demo"></div>
</div>
</body>
</html>
