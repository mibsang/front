<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ex1.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    // 달력 만들기 할건데 0914.test9.hrml, 0914.test10.hrml, 0914.test9.js 참조
    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth()+1;
    const date = today.getDate();
    
    window.onload = function() {
      let str = "";
      for(let i=2037; i>=1900; i--) {
        if(year == i) str += '<option selected>' + i + '</option>';
        else str += '<option>' + i + '</option>';
      }
      yy.innerHTML = str;
      
      str = "";
      for(let i=1; i<=12; i++) {
        if(month == i) str += '<option selected>' + i + '</option>';
        else str += '<option>' + i + '</option>';
      }
      mm.innerHTML = str;

      fCheck();
    }
    
    function fCheck() {     
      let yy = document.getElementById("yy").value;
      let mm = document.getElementById("mm").value;
      let lastDate = new Date(yy, mm, 0).getDate();
      let firstDay = new Date(yy, mm - 1, 1).getDay();

      for(let i=0; i<42; i++) {
        let cell = document.getElementById("d"+i);
        if(i < firstDay || i >= firstDay + lastDate) {  // i < firstDay : 첫번째 요일의 인덱스보다 작으면 날짜가 찍히면 안된다
          cell.innerText = "";                          // i >= firstDay + lastDate : firstDay + lastDate면 해당 월의 마지막 일자가 찍힌 다음 인덱스
        }
        else cell.innerText = i - firstDay +1;
      }
    }
</script>

  th:last-child, td:last-child {

</style>

<body>

    <select name="mm" id="mm" style="width: 50px; margin-right: 7px;"></select>월
    <button type="button" onclick="fCheck()" class="btn btn-secondary">확인</button>
