<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ex3.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    // 디지털 시계 만들건데 0915.test6.html 이랑 0915.test7.html 참조
    
    var statusTime;
    
    // 시스템의 시간을 읽어오기
    function clock() {
      let today = new Date();
      let str = "";

      let hh = ("0" + today.getHours()).slice(-2);
      str += "<img src='../../Images/t"+hh.substring(0,1)+".png' style='width:70px'/>";
      str += "<img src='../../Images/t"+hh.substring(1)+".png' style='width:70px'/>";
      str += " : ";
      let mm = ("0" + today.getMinutes()).slice(-2);
      str += "<img src='../../Images/t"+mm.substring(0,1)+".png' style='width:70px'/>";
      str += "<img src='../../Images/t"+mm.substring(1)+".png' style='width:70px'/>";
      str += " : ";
      let ss = ("0" + today.getSeconds()).slice(-2);
      str += "<img src='../../Images/t"+ss.substring(0,1)+".png' style='width:70px'/>";
      str += "<img src='../../Images/t"+ss.substring(1)+".png' style='width:70px'/>";
      str += " : ";
      
      demo.innerHTML = str;
    }
    function start() {
      clock();
      statusTime = setTimeout(start, 1000)
    }
    function stop() {
      clearTimeout(statusTime)
    }    
</script>
</head>
<body>
<p><br></p>
<div class="container">
  <h2></h2>
  <hr>
  <input type="button" value="동작" onclick="start()" class="btn btn-success">
  <input type="button" value="정지" onclick="stop()" class="btn btn-danger">
  <hr>
  <div id="demo"></div>
</div>
</body>
</html>
