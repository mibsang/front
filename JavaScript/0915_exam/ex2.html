<body>
<p><br></p>
<div class="container">
  <h2>회원가입</h2>
  <hr>
  <form name="myform" method="post">
    <div class="input-group mb-3">
      <div class="input-group-text" style="width: 110px; display: block; text-align: center;">이름</div>
      <input type="text" name="name" id="name" autofocus required  class="form-control"/>
    </div>
    <div class="input-group mb-3">
      <div class="input-group-text" style="width: 110px; display: block; text-align: center;">나이</div>
      <input type="number" name="age" id="age" min="12" max="70" required  class="form-control"/>
    </div>
    <div class="input-group mb-3">
      <div class="input-group-text" style="width: 110px; display: block; text-align: center;">성별</div>
      <div class="form-control d-flex align-items-center gap-4">
        <div class="form-check form-check-inline m-0">
          <input class="form-check-input" type="radio" name="gender" id="genderM" value="M">
          <label class="form-check-label" for="genderM">남자</label>
        </div>
        <div class="form-check form-check-inline m-0">
          <input class="form-check-input" type="radio" name="gender" id="genderF" value="F" checked>
          <label class="form-check-label" for="genderF">여자</label>
        </div>
      </div>
    </div>
    <div class="input-group mb-3">
      <div class="input-group-text" style="width: 110px; display: block; text-align: center;">아이디</div>
      <input type="text" name="mid" id="mid" required  class="form-control"/>
      <input type="button" value="확인" onclick="regexCheck()" class="btn btn-success" />
    </div>
    <div class="input-group mb-3">
      <div class="input-group-text" style="width: 110px; display: block; text-align: center;">비밀번호</div>
      <input type="text" name="pwd" id="pwd" required  class="form-control"/>
      <input type="button" value="확인" onclick="regexCheck()" class="btn btn-success" />
    </div>
    <div class="input-group mb-3">
      <div class="input-group-text" style="width: 110px; display: block; text-align: center;">비밀번호 확인</div>
      <input type="text" name="pwd" id="pwd" required  class="form-control"/>
      <input type="button" value="확인" onclick="regexCheck()" class="btn btn-success" />
    </div>
    <div class="input-group mb-3">
      <div class="input-group-text" style="width: 110px; display: block; text-align: center;">닉네임</div>
      <input type="text" name="nName" id="nName" required  class="form-control"/>
      <input type="button" value="확인" onclick="regexCheck()" class="btn btn-success" />
    </div>
    <div class="text-center">
      <input type="submit" value="회원가입" onclick="regexCheck()" class="btn btn-primary me-3" />
      <input type="reset" value="다시입력" onclick="regexCheck()" class="btn btn-danger" />
    </div>

  </form>
</div>
</body>
</html>
