  <script>
    'use strict';
    
    function receiveCheck() {
      document.getElementById("mid").value = opener.document.getElementById("mid").value
    }
    function sendCheck() {
      opener.document.getElementById("mid").value = document.getElementById("mid").value
    }

</script>

<body onload="receiveCheck()">
<p><br></p>
<div class="container">
  <h2>자식윈도우</h2>
  <form name="chileForm">

    <p>아이디
      <input type="text" name="mid" id="mid" autofocus>
    </p>
    <p>
      <button type="button" onclick="receiveCheck()" class="btn btn-success">아이디 가져오기</button>
      <button type="button" onclick="sendCheck()" class="btn btn-warning">아이디 넘겨주기</button>
      <button type="button" onclick="window.close()" class="btn btn-info">윈도우 창닫기</button>
    </p>
  </form>
