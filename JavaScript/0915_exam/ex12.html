  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    
    function newWindow() {
      let url = "ex11_child.html";
      let windowName = "childWindow"
      let w = 500;
      let h = 300;
      let x = (window.screen.width -w) / 2;
      let y = (window.screen.height -h) / 2;
      let opt = `width=${w}px, height=${h}px, top=${y}px, left=${x}px`

      newWin = window.open(url, windowName, opt)
    }
</script>
</head>
<body>
<p><br></p>
<div class="container">
  <h2>윈도우 창 중앙에 띄우기</h2>
  <hr>
  <div>
    <button type="button" onclick="newWindow()" class="btn btn-success">윈도우 중앙에 띄우기</button>
  </div>
  <hr>
</div>
</body>
