<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ex10_parent.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    
    let newWin;
    
    function newWindow() {
      let url = "ex10_child.html";
      let windowName = "childWindow"
      let opt = "width=500px, height=450px, top=200px, left=300px"

      newWin = window.open(url, windowName, opt)
    }
    
    function windowClose() {
      newWin.close();
    }
</script>
</head>
<body>
<p><br></p>
<div class="container">
  <h2>부모윈도우</h2>
  <hr>
  <div>
    <input type="button" value="새창열기" onclick="newWindow()" class="btn btn-success">
    <input type="button" value="창닫기" onclick="windowClose()" class="btn btn-warning">
  </div>
</div>
</body>
</html>
