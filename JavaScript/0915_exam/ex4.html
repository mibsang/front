<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ex4.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    
    function backClear() {
      let str2 = document.getElementById("str").value;

      if(str2 == "") {
        alert("문자를 입력하세요")
        return false;
      }

      str2 = str2.slice(0, -1);

      document.getElementById("str").value = str2;
      document.getElementById("str").focus();
    }
    
    
</script>
</head>
<body>
<p><br></p>
<div class="container">
  <h2>BackSpace 연습</h2>
    <form name="myform">
      <div>문자 입력</div>
      <div class="input-group">
      <input type="text" name="str" id="str" value="Welcome to Korea!" autofocus class="form-control">
      <input type="button" value="BackSpace" onclick="backClear()" class="btn btn-success">
      </div>
    </form>
</div>
</body>
</html>
