<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test8.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    
    function windowCheck() {
      let str = "";

      str += "화면 해상도 - 가로크기 : " + window.screen.width + "px<br>";
      str += "화면 해상도 - 세로크기 : " + window.screen.height + "px<br>";
      str += "작업영역 - 가로크기 : " + window.screen.availWidth + "px<br>";
      str += "작업영역 - 세로크기 : " + window.screen.availHeight + "px<br>";
      str += "표현 가능 색상 수 : " + Math.pow(2, window.screen.colorDepth) + "px<br>";
      str += "픽셀당 표현 가능 색상 수 : " + Math.pow(2, window.screen.pixelDepth) + "px<br>";

      demo.innerHTML = str;
    }
    
</script>
</head>
<body>
<p><br></p>
<div class="container">
  <h2>윈도우 정보보기</h2>
  <hr>
  <div>
    <button type="button" onclick="windowCheck()" class="btn btn-success">윈도우 정보보기</button>
  </div>
  <hr>
  <div id="demo"></div>
</div>
</body>
</html>
