<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test7.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    var statusTime;
    
    // 시스템의 시간을 읽어오기
    function clock() {
      let today = new Date();
      let hh = today.getHours();
      let mm = today.getMinutes();
      let ss = today.getSeconds();

      demo.innerHTML = hh + " : " + mm + " : " + ss
    }
    // function start() {
    //   clock();
    //   statusTime = setTimeout(start, 1000)
    // }
    function stop() {
      clearTimeout(statusTime)
    }
    function start() {
      statusTime = setInterval(() => {
        clock();
      }, 1000);
    }
    
</script>
</head>
<body>
<p><br></p>
<div class="container">
  <h2></h2>
  <hr>
  <input type="button" value="동작" onclick="start()" class="btn btn-success">
  <input type="button" value="정지" onclick="stop()" class="btn btn-danger">
  <hr>
  <div id="demo"></div>
</div>
</body>
</html>
