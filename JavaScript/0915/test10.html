<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test10.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    
    function mouseClick(e) {
      let x = e.screenX;
      let y = e.screenY;

      let str = '';
      str += '발생된 이벤트 : ' + e.type;
      str += '<br>x좌표 : ' + x;
      str += '<br>y좌표 : ' + y;

      demo.style.backgroundColor = '#fff';
      demo.style.color = '#000';
      
      demo.innerHTML = str;
    }
    function mouseDblClick() {
      demo.style.backgroundColor = 'brown';
      demo.style.color = '#fff';
    }
    function mouseRightClick() {
      demo.style.backgroundColor = 'blue';
      demo.style.color = 'yellow';
    }

    document.onclick = mouseClick;
    document.ondblclick = mouseDblClick;
    document.oncontextmenu = mouseRightClick;
</script>
</head>
<body>
<p><br></p>
<div class="container">
  <h2>마우스 위치 감지</h2>
  <h4>마우스를 클릭하시면 현재 윈도우 좌표를 확인할 수 있습니다.</h4>
  <hr>
  <div id="demo"></div>
</div>
</body>
</html>
