<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test6.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    
    let num = 0;
    let statusTime;
    
    function plus() {
      clearInterval(statusTime);
      num++;

      statusTime = setInterval(plus, 500);

      if(num == 10) clearInterval(statusTime);

      demo.innerHTML = num;
    }
    function minus() {
      clearInterval(statusTime);
      num--;
      statusTime = setInterval(minus, 500);

      if(num == -10) clearInterval(statusTime);
      demo.innerHTML = num;
    }
    function stop() {
      clearInterval(statusTime);
    }
    // setInterval(() => {
    //   console.log("1.setInterval() 함수 실행중...");
    // }, 1000);
    
</script>
</head>
<body>
<p><br></p>
<div class="container">
  <h2>setInterval() 함수 호출</h2>
  <p>
    <button type="button" onclick="plus()" class="btn btn-success">증가</button>
    <button type="button" onclick="minus()" class="btn btn-danger">감소</button>
    <button type="button" onclick="stop()" class="btn btn-warning">정지</button>
  </p>
  <p>
    <div id="demo" style="font-size: 1em;font-weight: 800; color: red;"></div>
  </p>
</div>
</body>
</html>
