<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test16-1.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    
    function fCheck() {
      let product1 = document.getElementById("product1")
      let product2 = document.getElementById("product2")
      let product3 = document.getElementById("product3")
      let product4 = document.getElementById("product4")
      let product5 = document.getElementById("product5")
      
      console.log("name길이 : " + document.myForm.product.length);
      if(product1.value.trim() === ""){
        alert("상품명1을 입력해주세요")
        document.getElementById("product1").focus();
      }
      else if(product2.value.trim() === ""){
        alert("상품명2을 입력해주세요")
        document.getElementById("product2").focus();
      }
      else if(product3.value.trim() === ""){
        alert("상품명3을 입력해주세요")
        document.getElementById("product3").focus();
      }
      else if(product4.value.trim() === ""){
        alert("상품명4을 입력해주세요")
        document.getElementById("product4").focus();
      }
      else if(product5.value.trim() === ""){
        alert("상품명5을 입력해주세요")
        document.getElementById("product5").focus();
      }
      else {
        alert("입력완료")
      }
    }
    
    
</script>
<style>
  th {
    text-align: center;
    background-color: #ccd !important;
    vertical-align: middle;
  }
</style>
</head>
<body>
<p><br></p>
<div class="container">
  <form name="myForm">
    <h3 style="text-align: center;">상품 주문서</h3>
    <table class="table table-bordered mt-4">
      <tr>
        <th><label for="product1">상품명1</label></th>
        <td><input type="text" name="product" id="product1" placeholder="상품명을 입력해주세요" class="form-control" required autofocus></td>
      </tr>
      <tr>
        <th><label for="product2">상품명2</label></th>
        <td><input type="text" name="product" id="product2" placeholder="상품명을 입력해주세요" class="form-control" required></td>
      </tr>
      <tr>
        <th><label for="product3">상품명3</label></th>
        <td><input type="text" name="product" id="product3" placeholder="상품명을 입력해주세요" class="form-control" required></td>
      </tr>
      <tr>
        <th><label for="product4">상품명4</label></th>
        <td><input type="text" name="product" id="product4" placeholder="상품명을 입력해주세요" class="form-control" required></td>
      </tr>
      <tr>
        <th><label for="product5">상품명5</label></th>
        <td><input type="text" name="product" id="product5" placeholder="상품명을 입력해주세요" class="form-control" required></td>
      </tr>
      <tr>
        <td colspan="2" class="text-center">
          <input type="button" value="전송" onclick="fCheck()" class="btn btn-success">
          <input type="reset" value="다시입력" class="btn btn-warning">
        </td>
      </tr>
    </table>
  </form>
</div>
</body>
</html>
