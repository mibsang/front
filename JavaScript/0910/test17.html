<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test17.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    
    function fCheck() {
      let str = '';
      let mid = document.getElementById("mid").value;
      let gender = document.myform.gender.value;
      let job = document.myform.job.value;


      if(mid.trim() === "") {
        alert("아이디를 입력하세요")
        document.getElementById("mid").focus();
      }
      else {
        let hobby = '';
        if(document.getElementById("hobby1").checked) hobby += document.getElementById("hobby1").value + " / ";
        if(document.getElementById("hobby2").checked) hobby += document.getElementById("hobby2").value + " / ";
        if(document.getElementById("hobby3").checked) hobby += document.getElementById("hobby3").value + " / ";
        if(document.getElementById("hobby4").checked) hobby += document.getElementById("hobby4").value + " / ";
        if(document.getElementById("hobby5").checked) hobby += document.getElementById("hobby5").value + " / ";
        if(document.getElementById("hobby6").checked) hobby += document.getElementById("hobby6").value + " / ";
        if(document.getElementById("hobby7").checked) hobby += document.getElementById("hobby7").value + " / ";
        
        hobby = hobby.substring(0, (hobby.length-2));
        
        let mnt = "";
        if(document.getElementById("mnt").options[0].selected) mnt += document.getElementById("mnt").options[0].value+" / ";
        if(document.getElementById("mnt").options[1].selected) mnt += document.getElementById("mnt").options[1].value+" / ";
        if(document.getElementById("mnt").options[2].selected) mnt += document.getElementById("mnt").options[2].value+" / ";
        if(document.getElementById("mnt").options[3].selected) mnt += document.getElementById("mnt").options[3].value+" / ";
        if(document.getElementById("mnt").options[4].selected) mnt += document.getElementById("mnt").options[4].value+" / ";
        if(document.getElementById("mnt").options[5].selected) mnt += document.getElementById("mnt").options[5].value+" / ";
        if(document.getElementById("mnt").options[6].selected) mnt += document.getElementById("mnt").options[6].value+" / ";
        if(document.getElementById("mnt").options[7].selected) mnt += document.getElementById("mnt").options[7].value+" / ";
        if(document.getElementById("mnt").options[8].selected) mnt += document.getElementById("mnt").options[8].value+" / ";
        if(document.getElementById("mnt").options[9].selected) mnt += document.getElementById("mnt").options[9].value+" / ";
        
        mnt = mnt.substring(0, (mnt.length-2));

        str += "아이디 : " + mid + "<br>";
        // str += "비밀번호 : " + pwd;
        str += "성별 : " + gender + "<br>";
        str += "취미 : " + hobby + "<br>";
        str += "직업 : " + job + "<br>";
        str += "좋아하는 산 : " + mnt + "<br>";
        demo.innerHTML = str;
      }
    }
    
    
</script>
<style>
  th {
    text-align: center;
    background-color: #eee !important;
  }
</style>
</head>
<body>
<p><br></p>
<div class="container">
  <h2>폼 체크</h2>
  <form name="myform">
    <table class="table table-bordered" style="vertical-align: middle;">
      <tr>
        <th><label for="mid">아이디</label></th>
        <td><input type="text" name="mid" id="mid" class="form-control" required></td>
      </tr>
      <tr>
        <th>비밀번호</th>
        <td></td>
      </tr>
      <tr>
        <th>성명</th>
        <td></td>
      </tr>
      <tr>
        <th>나이</th>
        <td></td>
      </tr>
      <tr>
        <th>성별</th>
        <td>
          <input type="radio" name="gender" id="mail" value="남자">남자
          <input type="radio" name="gender" id="femail" value="여자" checked>여자
        </td>
      </tr>
      <tr>
        <th>취미</th>
        <td>
          <input type="checkbox" name="hobby" id="hobby1" value="등산" class="me-2">등산
          <input type="checkbox" name="hobby" id="hobby2" value="낚시" class="me-2">낚시
          <input type="checkbox" name="hobby" id="hobby3" value="바이크" class="me-2">바이크
          <input type="checkbox" name="hobby" id="hobby4" value="바둑" class="me-2">바둑
          <input type="checkbox" name="hobby" id="hobby5" value="맛집탐방" class="me-2">맛집탐방
          <input type="checkbox" name="hobby" id="hobby6" value="당구" class="me-2">당구
          <input type="checkbox" name="hobby" id="hobby7" value="축구">축구
        </td>
      </tr>
      <tr>
        <th>직업</th>
        <td>
          <select name="job" id="job" class="form-select">
            <option selected>학생</option>
            <option>회사원</option>
            <option>군인</option>
            <option>공무원</option>
            <option>의사</option>
            <option>자영업</option>
            <option>기타</option>
          </select>
        </td>
      </tr>
      <tr>
        <th>좋아하는 산</th>
        <td>
          <select name="mnt" id="mnt" class="form-select" size="5" multiple>
            <option selected>백두산</option>
            <option>한라산</option>
            <option>태백산</option>
            <option>소백산</option>
            <option>천태산</option>
            <option>관악산</option>
            <option>북한산</option>
            <option>도봉산</option>
            <option>우암산</option>
            <option>신불산</option>
          </select>
        </td>
      </tr>
      <tr>
        <th></th>
        <td></td>
      </tr>
      <tr>
        <th></th>
        <td></td>
      </tr>
      <tr>
        <th></th>
        <td></td>
      </tr>
      <tr>
        <td colspan="2" class="text-center">
          <button type="button" onclick="fCheck()" class="btn btn-success">회원가입</button>
          <button type="reset" class="btn btn-info">다시입력</button>
          <button type="" class="btn btn-warning">새로고침</button>
          <button type="" class="btn btn-primary">돌아가기</button>
        </td>
      </tr>
    </table>
  </form>
  <hr>
  <div id="demo"></div>
</div>
</body>
</html>
