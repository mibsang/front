<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test12.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    
    function calc() {
      let su = prompt("수를 입력하세요")
      
      // let res = su + 100;
      // let res = parseInt(su) + 100;
      // let res = Number(su) + 100;
      let res = eval(su) + 100;
      alert("res : " + res);
      console.log("res :",res);
    }
    
    function calc2() {
      let su = 0;
      
      while(true) {
        su = Number(prompt("수를 입력하세요"));
        if(isNaN(su)) {
          alert("숫자만 입력하세요")
          continue;
        }
        else break;
      }
      alert(su);
    }
  </script>
</head>
<body>
<p><br></p>
<div class="container">
  <h2>본문</h2>
  <p>
    <input type="button" value="계산" onclick="calc()">
    <input type="button" value="숫자체크" onclick="calc2()">
  </p>
</div>
</body>
</html>
