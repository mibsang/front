<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test9.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    
    // Number;
    let su1 = 100;
    console.log("su1 : " + su1);
    console.log("typeof(su1) : " + typeof(su1));
    
    let su2 = 3.14;
    console.log("su2 : " + su2);
    console.log("typeof(su2) : " + typeof(su2));
    
    // String
    let su3 = '하나 둘 셋';
    console.log("su3 : " + su3);
    console.log("typeof(su3) : " + typeof(su3));
    
    let su4 = "100";
    console.log("su4 : " + su4);
    console.log("typeof(su4) : " + typeof(su4));
    
    let su5 = "1";
    console.log("su5 : " + su5);
    console.log("typeof(su5) : " + typeof(su5));
    
    let su6 = true;
    console.log("su6 : " + su6);
    console.log("typeof(su6) : " + typeof(su6));
    
    let person = {    // json 포멧
      firstName:"john",
      lastName:"type"
    };
    console.log("person : " + person);
    console.log("firstName = " + person.firstName);
    console.log("lastName = " + person.lastName);
    console.log("");
    
    // Array Object
    const cars = ["그렌져","벤츠","카니발"];
    console.log("cars = " + cars);
    console.log("typeof(cars) : " + typeof(cars));
    console.clear;

    const date = new Date("2026-9-10");
    console.log("date : " + date);
    console.log("typeof(date) = "+ typeof(date));
  </script>
</head>
<body>
<p><br></p>
<div class="container">
  <h2>함수 호출</h2>
  
</div>
</body>
</html>
