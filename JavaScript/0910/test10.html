<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test10.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    
    function msg1() {
      alert("메세지 출력");
    }
    
    function msg2() {
      let cel = prompt("점수를 입력하세요");
      alert("입력하신 내용은 " + cel + "입니다.")
    }
    
    function msg3() {
      let ans = confirm("작업을 계속하시겠습니까?(y/n)");
      // alert("ans = " + ans)
      if(ans) {
        alert("작업을 계속합니다");
      }
      else {
        alert("작업을 마칩니다");
      }
    }
    
    
</script>
</head>
<body>
<p><br></p>
<div class="container">
  <h2>메세지 연습</h2>
  <p>
    <input type="button" value="메세지출력1" onclick="msg1()" class="btn btn-success">
    <input type="button" value="메세지출력 후 입력" onclick="msg2()" class="btn btn-secondary">
    <input type="button" value="계속선택?" onclick="msg3()" class="btn btn-warning">
  </p>
</div>
</body>
</html>
