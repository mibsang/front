<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test2.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';

    function dtom(su) {
      document.getElementById("su").value += su;
    }
    function clearcalc() {
      document.getElementById("su").value = '';
    }
    function calc() {
      let res = eval(document.getElementById("su").value);

      demo.innerText = res;
      document.getElementById("res").value =  res;   
    }

  </script>
</head>
<body>
<p><br></p>
<div class="container">
  <h2>함수 호출 연습</h2>
    <p>
      <div class="mb-0">
        <input type="text" name="su" id="su" style="text-align: right; margin-bottom: 8px;">
      </div>  
      <div class="mb-2">
        <input type="text" name="res" id="res" style="text-align: right; margin-bottom: 8px;">

      </div>
      <div>
        <input type="button" value="+" onclick="dtom('+')">
        <input type="button" value="-" onclick="dtom('-')">
        <input type="button" value="*" onclick="dtom('*')">
        <input type="button" value="/" onclick="dtom('/')">
      </div>
      <div>
        <input type="button" value="1" onclick="dtom('1')">
        <input type="button" value="2" onclick="dtom('2')">
        <input type="button" value="3" onclick="dtom('3')">
      </div>
      <div>
        <input type="button" value="4" onclick="dtom('4')">
        <input type="button" value="5" onclick="dtom('5')">
        <input type="button" value="6" onclick="dtom('6')">
      </div>
      <div>
        <input type="button" value="7" onclick="dtom('7')">
        <input type="button" value="8" onclick="dtom('8')">
        <input type="button" value="9" onclick="dtom('9')">
      </div>
      <div>
        <input type="button" value="0" onclick="dtom('0')">
        <input type="button" value="C" onclick="clearcalc()">
        <input type="button" value="=" onclick="calc()">
      </div>
    </p>
    <hr>
    <div id="demo"></div>
</div>  
</body>
</html>
