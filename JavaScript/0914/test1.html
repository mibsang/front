<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test1.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';

    function atom(su) {
      alert("아톰입니다.\n무엇을 도와드릴까요? - " + su);
      btom(su);
    }
    function btom(su) {
      alert("비톰입니다.\n무엇을 도와드릴까요? - " + su);
    }
    function ctom() {
      let su1 = Number(document.getElementById("su1").value);
      let su2 = Number(document.getElementById("su2").value);
      document.getElementById("demo").innerText = (su1+su2) + "입니다."
    }
  </script>
</head>
<body>
<p><br></p>
<div class="container">
  <h2>함수 호출 연습</h2>
    <p class="mt-3">
      <input type="button" value="함수호출1" onclick="atom(10)">
    </p>
    <p>
      <div class="input-group mb-2">
        <div class="input-group-text bg-secondary-subtle mb-2 me-2">su1</div>
        <input type="text" name="su1" id="su1" value="100" style="text-align: right; margin-bottom: 8px;">
      </div>
      <div class="input-group mb-2">
        <div class="input-group-text bg-secondary-subtle mb-2 me-2">su2</div>
        <input type="text" name="su2" id="su2" value="200" style="text-align: right; margin-bottom: 8px;">
      </div>  
      <input type="button" value="계산1" onclick="ctom()">
    </p>
    <hr>
    <div id="demo"></div>
</div>  
</body>
</html>
