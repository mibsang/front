<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test4.html</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    'use strict';
    
    function allSelect() {
      for(let i=0; i<document.getElementsByName("hobby").length; i++){
        document.getElementsByName("hobby")[i].checked = true;
      }
    }
    function allClear() {
      for(let i=0; i<document.getElementsByName("hobby").length; i++){
        document.getElementsByName("hobby")[i].checked = false;
      }
    }
    function reverse() {
      for(let i=0; i<document.getElementsByName("hobby").length; i++){
        if(document.getElementsByName("hobby")[i].checked) document.getElementsByName("hobby")[i].checked = false;
        else document.getElementsByName("hobby")[i].checked = true;
      }
    }
</script>
</head>
<body>
<p><br></p>
<div class="container">
  <h2>취미는??</h2>
  <div class="input-group mb-2">
    <div class="input-group-text me-2">취미</div> <!--체크박스-->
    <input type="checkbox" name="hobby" id="hobby1" value="등산" class="me-1" checked>등산 &nbsp;
    <input type="checkbox" name="hobby" id="hobby2" value="낚시" class="me-1">낚시 &nbsp;
    <input type="checkbox" name="hobby" id="hobby3" value="축구" class="me-1">축구 &nbsp;
    <input type="checkbox" name="hobby" id="hobby4" value="농구" class="me-1">농구 &nbsp;
    <input type="checkbox" name="hobby" id="hobby5" value="야구" class="me-1">야구 &nbsp;
    <input type="checkbox" name="hobby" id="hobby6" value="수영" class="me-1">수영 &nbsp;
    <input type="checkbox" name="hobby" id="hobby7" value="기타" class="me-1">기타 &nbsp;
  </div>
  <button type="button" onclick="allSelect()" class="btn btn-success">전체선택</button>
  <button type="button" onclick="allClear()" class="btn btn-warning">전체취소</button>
  <button type="button" onclick="reverse()" class="btn btn-danger">선택반전</button>
</div>
</body>
</html>
